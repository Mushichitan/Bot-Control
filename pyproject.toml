[project]
name = "crypto-bot-control-center"
version = "1.0.0"
description = "Desktop control center for user-supplied Python crypto trading bots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "sqlalchemy==2.0.36",
  "pydantic==2.10.4",
  "cryptography==44.0.0",
  "python-multipart==0.0.20",
  "watchdog==6.0.0",
  "httpx==0.28.1",
  "psutil==6.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
crypto-bot-control = "crypto_bot_control.main:cli"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
